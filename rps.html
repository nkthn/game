<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaitlynn vs Mom</title>
<style>
  :root {
    --bg: #fff7ef; --card: #ffffff; --ink: #2b2233; --muted: #7a6f80;
    --k: #e0569b; --k-soft: #fde3f0; --m: #3b82c4; --m-soft: #dcecfa;
    --line: #ecdfe6; --win: #2f9e5b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1720; --card: #26212c; --ink: #f3eef6; --muted: #a99fb0;
      --k: #ff7cb8; --k-soft: #4a2638; --m: #6fb1ee; --m-soft: #1f3447;
      --line: #3a3241; --win: #5fd08d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1720; --card: #26212c; --ink: #f3eef6; --muted: #a99fb0;
    --k: #ff7cb8; --k-soft: #4a2638; --m: #6fb1ee; --m-soft: #1f3447;
    --line: #3a3241; --win: #5fd08d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 520px; padding: 24px 16px 40px; text-align: center; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  h1 .k { color: var(--k); } h1 .m { color: var(--m); }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }

  .score { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; margin-bottom: 20px; }
  .pl { border-radius: 16px; padding: 12px 8px; border: 2px solid transparent; transition: border-color .2s; }
  .pl.k { background: var(--k-soft); } .pl.m { background: var(--m-soft); }
  .pl.k.active { border-color: var(--k); } .pl.m.active { border-color: var(--m); }
  .pl .name { font-weight: 700; font-size: 1rem; }
  .pl.k .name { color: var(--k); } .pl.m .name { color: var(--m); }
  .pl .pts { font-size: 2.4rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .ties { align-self: center; color: var(--muted); font-size: .85rem; }
  .ties b { display: block; font-size: 1.3rem; color: var(--ink); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px 16px; min-height: 260px; }
  .prompt { font-size: 1.3rem; font-weight: 700; margin: 0 0 6px; }
  .hint { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  .choices { display: flex; gap: 10px; justify-content: center; }
  .choice {
    flex: 1; max-width: 130px; aspect-ratio: 1; border-radius: 18px; border: 2px solid var(--line);
    background: var(--bg); color: var(--ink); cursor: pointer; font: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    transition: transform .1s, border-color .15s;
  }
  .choice .emo { font-size: 2.6rem; line-height: 1; }
  .choice .lbl { font-size: .85rem; font-weight: 600; }
  .choice:hover { transform: translateY(-2px); }
  .choice:active { transform: scale(.96); }
  .turn-k .choice:hover { border-color: var(--k); }
  .turn-m .choice:hover { border-color: var(--m); }

  .btn {
    border: 0; border-radius: 999px; padding: 14px 26px; font: inherit; font-weight: 700; font-size: 1.05rem;
    cursor: pointer; color: #fff; background: var(--ink);
  }
  .btn.k { background: var(--k); } .btn.m { background: var(--m); }
  .btn.ghost { background: transparent; color: var(--muted); font-weight: 500; font-size: .9rem; padding: 8px 14px; }

  .reveal { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 4px 0 16px; }
  .hand { font-size: 4rem; line-height: 1; }
  .hand.pop { animation: pop .45s ease-out both; }
  .hand.k-side { transform: scaleX(-1); }
  .hand.k-side.pop { animation-name: popflip; }
  .who { font-weight: 700; font-size: .9rem; margin-top: 6px; }
  .who.k { color: var(--k); } .who.m { color: var(--m); }
  .vs { color: var(--muted); font-weight: 700; }
  .result { font-size: 1.5rem; font-weight: 800; margin: 0 0 4px; }
  .why { color: var(--muted); margin: 0 0 20px; }
  .winner { outline: 3px solid var(--win); outline-offset: 6px; border-radius: 16px; }

  .count { font-size: 3.5rem; font-weight: 800; margin: 30px 0; animation: pop .35s ease-out both; }

  .history { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 28px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; display: inline-block; font-size: .7rem; line-height: 22px; color: #fff; font-weight: 700; }
  .dot.k { background: var(--k); } .dot.m { background: var(--m); } .dot.t { background: var(--muted); }
  .footer { margin-top: 14px; }

  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes popflip { from { transform: scaleX(-1) scale(.3); opacity: 0; } to { transform: scaleX(-1) scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1><span class="k">Kaitlynn</span> vs <span class="m">Mom</span></h1>
  <p class="sub">Rock, Paper, Scissors — pass the phone, no peeking!</p>

  <div class="score">
    <div class="pl k" id="plK"><div class="name">Kaitlynn</div><div class="pts" id="scoreK">0</div></div>
    <div class="ties"><b id="scoreT">0</b>ties</div>
    <div class="pl m" id="plM"><div class="name">Mom</div><div class="pts" id="scoreM">0</div></div>
  </div>

  <div class="card" id="card"></div>

  <div class="history" id="history" aria-label="Round history"></div>
  <div class="footer"><button class="btn ghost" id="reset">Reset scores</button></div>
</main>

<script>
  const PLAYERS = { k: "Kaitlynn", m: "Mom" };
  const MOVES = {
    rock:     { emo: "✊", label: "Rock",     beats: "scissors", verb: "smashes" },
    paper:    { emo: "✋", label: "Paper",    beats: "rock",     verb: "covers" },
    scissors: { emo: "✌️", label: "Scissors", beats: "paper",    verb: "cuts" },
  };

  const state = { score: { k: 0, m: 0, t: 0 }, picks: {}, history: [], round: 0 };
  const card = document.getElementById("card");

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem("rps-km") || "null");
      if (saved) { state.score = saved.score; state.history = saved.history; }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem("rps-km", JSON.stringify({ score: state.score, history: state.history })); } catch (e) {}
  }

  function renderScore(winner) {
    document.getElementById("scoreK").textContent = state.score.k;
    document.getElementById("scoreM").textContent = state.score.m;
    document.getElementById("scoreT").textContent = state.score.t;
    const h = document.getElementById("history");
    h.innerHTML = state.history.slice(-20).map(r =>
      `<span class="dot ${r}" title="${r === "t" ? "Tie" : PLAYERS[r] + " won"}">${r === "t" ? "=" : r.toUpperCase()}</span>`
    ).join("");
  }

  function setActive(who) {
    document.getElementById("plK").classList.toggle("active", who === "k");
    document.getElementById("plM").classList.toggle("active", who === "m");
  }

  // Kaitlynn and Mom take turns going first each round
  function firstPlayer() { return state.history.length % 2 === 0 ? "k" : "m"; }

  function showPick(who) {
    setActive(who);
    card.className = "card turn-" + who;
    card.innerHTML = `
      <p class="prompt" style="color:var(--${who})">${PLAYERS[who]}, pick!</p>
      <p class="hint">${PLAYERS[other(who)]}, look away 🙈</p>
      <div class="choices">
        ${Object.entries(MOVES).map(([key, mv]) =>
          `<button class="choice" data-move="${key}"><span class="emo">${mv.emo}</span><span class="lbl">${mv.label}</span></button>`
        ).join("")}
      </div>`;
    card.querySelectorAll(".choice").forEach(b => b.onclick = () => {
      state.picks[who] = b.dataset.move;
      if (state.picks[other(who)]) countdown();
      else handOff(other(who));
    });
  }

  function handOff(next) {
    setActive(null);
    card.className = "card";
    card.innerHTML = `
      <p class="prompt">Got it! 🤫</p>
      <p class="hint">Now hand the phone to <b style="color:var(--${next})">${PLAYERS[next]}</b>.</p>
      <button class="btn ${next}" id="ready">I'm ${PLAYERS[next]} — ready!</button>`;
    document.getElementById("ready").onclick = () => showPick(next);
  }

  function countdown() {
    setActive(null);
    card.className = "card";
    const words = ["Rock…", "Paper…", "Scissors…", "Shoot!"];
    let i = 0;
    const step = () => {
      if (i >= words.length) return reveal();
      card.innerHTML = `<div class="count">${words[i]}</div>`;
      i++;
      setTimeout(step, 550);
    };
    step();
  }

  function reveal() {
    const k = state.picks.k, m = state.picks.m;
    let winner, why;
    if (k === m) { winner = "t"; why = `You both picked ${MOVES[k].label}!`; }
    else if (MOVES[k].beats === m) { winner = "k"; why = `${MOVES[k].label} ${MOVES[k].verb} ${MOVES[m].label.toLowerCase()}`; }
    else { winner = "m"; why = `${MOVES[m].label} ${MOVES[m].verb} ${MOVES[k].label.toLowerCase()}`; }

    state.score[winner]++;
    state.history.push(winner);
    save();
    renderScore();

    const title = winner === "t" ? "It's a tie! 🤝" : `${PLAYERS[winner]} wins! 🎉`;
    card.className = "card";
    card.innerHTML = `
      <div class="reveal">
        <div class="${winner === "k" ? "winner" : ""}"><div class="hand pop k-side">${MOVES[k].emo}</div><div class="who k">Kaitlynn</div></div>
        <div class="vs">vs</div>
        <div class="${winner === "m" ? "winner" : ""}"><div class="hand pop">${MOVES[m].emo}</div><div class="who m">Mom</div></div>
      </div>
      <p class="result" style="color:${winner === "t" ? "var(--ink)" : `var(--${winner})`}">${title}</p>
      <p class="why">${why}</p>
      <button class="btn" id="again">Play again</button>`;
    document.getElementById("again").onclick = newRound;
  }

  function other(who) { return who === "k" ? "m" : "k"; }

  function newRound() {
    state.picks = {};
    const first = firstPlayer();
    setActive(null);
    card.className = "card";
    card.innerHTML = `
      <p class="prompt">Round ${state.history.length + 1}</p>
      <p class="hint"><b style="color:var(--${first})">${PLAYERS[first]}</b> goes first this time.</p>
      <button class="btn ${first}" id="start">Start</button>`;
    document.getElementById("start").onclick = () => showPick(first);
  }

  document.getElementById("reset").onclick = () => {
    if (!confirm("Reset the score to 0–0?")) return;
    state.score = { k: 0, m: 0, t: 0 };
    state.history = [];
    save(); renderScore(); newRound();
  };

  load();
  renderScore();
  newRound();
</script>
</body>
</html>
